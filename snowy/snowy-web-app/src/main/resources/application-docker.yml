server:
  port: 82

spring:
  datasource:
    dynamic:
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_HOST:snowy-mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:st_homework_manage}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useInformationSchema=true&rewriteBatchedStatements=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PWD:root}
  data:
    redis:
      database: ${REDIS_DB:1}
      host: ${REDIS_HOST:snowy-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      timeout: 10s

